;===========================================================================
; musiconhold.conf — MynxDialer hold music
;===========================================================================
; File-based music on hold. Points at the free 'opsound' music that ships with
; Asterisk (the asterisk-moh-opsound-wav package, installed in the Dockerfile),
; so it works out of the box with no extra audio files.
;
; Use file mode (not a custom streaming source): the internal player has no
; external process or buffer, so the music stops INSTANTLY when a call connects
; / a ConfBridge fills. A streaming source (e.g. ffmpeg piping internet radio)
; can leave a leftover process whose audio bleeds into live calls — avoid it.
;
; To use your OWN music: drop 8kHz / mono / 16-bit PCM .wav files into
; ./asterisk/moh (bind-mounted to /usr/share/asterisk/moh) and set
;   directory=/usr/share/asterisk/moh
; Only ship audio you have the rights to distribute.
;===========================================================================
[general]

[default]
mode=files
directory=/var/lib/asterisk/moh
sort=alpha
