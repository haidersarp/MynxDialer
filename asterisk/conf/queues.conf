;===========================================================================
; queues.conf — Asterisk Call Queues
;===========================================================================

[general]
persistentmembers = yes
autofill = yes
monitor-type = MixMonitor
updatecdr = yes

;---------------------------------------------------------------------------
; Default inbound queue
;---------------------------------------------------------------------------
[inbound]
strategy = ringall
timeout = 15
retry = 5
maxlen = 0
wrapuptime = 10
announce-frequency = 30
announce-holdtime = yes
announce-position = yes
musiconhold = default
joinempty = yes
leavewhenempty = no
ringinuse = no
autopause = no
autofill = yes

;---------------------------------------------------------------------------
; Per-campaign queues — add as needed
; Pattern: campaign_NAME
;---------------------------------------------------------------------------
[default]
strategy = rrmemory
timeout = 20
retry = 5
maxlen = 100
wrapuptime = 30
joinempty = yes
leavewhenempty = no
ringinuse = no
musiconhold = default
