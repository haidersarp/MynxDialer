;===========================================================================
; extensions.conf — MynxDialer UK Predictive Dialer
;===========================================================================

[globals]
TRUNK=trunk_endpoint

;===========================================================================
; FROM-ADMIN — context for admin/supervisor monitor endpoints (Live Monitor)
; The admin's browser (a WebRTC endpoint, e.g. 8000) dials a feature code to
; ChanSpy a live agent. Browser-INITIATED, so DTLS is reliable (same path as
; *88/*43 that work) — Asterisk never dials the admin per-monitor.
;   *55<ext> = Listen (silent)   *56<ext> = Whisper (agent only)   *57<ext> = Barge (both)
; ${EXTEN:3} strips the *5x prefix → the 4-digit agent extension to spy.
;===========================================================================
[from-admin]
exten => _*55XXXX,1,NoOp(Monitor LISTEN agent ${EXTEN:3})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},q)
 same => n,Hangup()
exten => _*56XXXX,1,NoOp(Monitor WHISPER agent ${EXTEN:3})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qw)
 same => n,Hangup()
exten => _*57XXXX,1,NoOp(Monitor BARGE agent ${EXTEN:3})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},qB)
 same => n,Hangup()
; Admins can also place normal internal/manual calls.
include => from-internal

;===========================================================================
; FROM-TRAINEE — context for trainee monitor endpoints (Trainee portal)
; DELIBERATELY NOT an include of from-admin or from-internal.
;
; Trainees get exactly ONE capability: *55<ext> = silent listen. Nothing else
; is reachable from this context — no whisper (*56), no barge (*57), no
; internal extensions, no outbound trunk. A trainee who knows the feature
; codes still has nothing to dial.
;
; WHY THE TRAINEE CANNOT BE HEARD (three independent layers):
;   1. ChanSpy without 'w' (whisper) or 'B' (barge) is READ-ONLY at the media
;      layer. The spy's audio is never mixed into the bridge — this is an
;      Asterisk property, not a UI restriction.
;   2. NO 'd' option. With 'd', a spy could press DTMF to cycle spy/whisper/
;      barge modes. Omitting it means DTMF cannot escalate to a talking mode.
;   3. The trainee browser never requests a microphone (getUserMedia audio
;      false → recvonly SDP), so there is no inbound media stream at all.
;
; Options are byte-identical to the proven from-admin LISTEN path ('q' =
; quiet, no beep to the agent/customer) so trainee listening behaves exactly
; like the Live Monitor listen that is already in production.
;===========================================================================
[from-trainee]
exten => _*55XXXX,1,NoOp(TRAINEE LISTEN agent ${EXTEN:3} from ${CALLERID(num)})
 same => n,Answer()
 same => n,ChanSpy(PJSIP/${EXTEN:3},q)
 same => n,Hangup()
; Explicit deny-all: anything else from a trainee endpoint is refused, so a
; future 'include' added above cannot silently widen trainee reach.
; NOTE: deliberately _*X. and _X. rather than a bare _. — a bare _. also
; matches Asterisk's special extensions (h/i/t/s) and would clobber hangup
; handling. These two cover every feature code and every number without
; touching the specials. _*55XXXX above is more specific, so it still wins.
exten => _*X.,1,NoOp(TRAINEE DENIED feature code: ${EXTEN} from ${CALLERID(num)})
 same => n,Playback(invalid)
 same => n,Hangup()
exten => _X.,1,NoOp(TRAINEE DENIED dial attempt: ${EXTEN} from ${CALLERID(num)})
 same => n,Playback(invalid)
 same => n,Hangup()

[from-internal]
; ── Internal extensions (agents calling each other) ──────────────────────
exten => _1XXX,1,Dial(PJSIP/${EXTEN},30,tTrK)
 same => n,Hangup()

; ── Outbound UK numbers from agent manual dial ───────────────────────────
; 07XXXXXXXXX → 447XXXXXXXXX
exten => _07.,1,NoOp(Manual dial UK 07: ${EXTEN})
 same => n,Set(CALLERID(all)=MynxDialer <${IF($["${DB(mynxdialer/default_cli)}" = ""]?441234567890:${DB(mynxdialer/default_cli)})}>)
 same => n,Dial(PJSIP/44${EXTEN:1}@${TRUNK},30,gTr)
 same => n,Hangup()

; 01/02 landlines
exten => _0[12].,1,NoOp(Manual dial UK landline: ${EXTEN})
 same => n,Set(CALLERID(all)=MynxDialer <${IF($["${DB(mynxdialer/default_cli)}" = ""]?441234567890:${DB(mynxdialer/default_cli)})}>)
 same => n,Dial(PJSIP/44${EXTEN:1}@${TRUNK},30,gTr)
 same => n,Hangup()

; 7XXXXXXXXX (mobile without leading 0)
exten => _7[0-9].,1,NoOp(Manual dial 7X: ${EXTEN})
 same => n,Set(CALLERID(all)=MynxDialer <${IF($["${DB(mynxdialer/default_cli)}" = ""]?441234567890:${DB(mynxdialer/default_cli)})}>)
 same => n,Dial(PJSIP/44${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

; Already international (44...)
exten => _44.,1,NoOp(Manual dial international: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

; Generic fallback
exten => _X.,1,NoOp(Manual dial generic: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

; Parking
exten => 700,1,Parked()
exten => _70X,1,ParkedCall(${EXTEN})

; ── Conference confirmation audio — dial *43 to test your audio ──────────
exten => *43,1,Goto(agent-ready,s,1)

; ── Agent joins their PRIVATE conference room (browser dials *88 on Available) ──
; Room name = the agent's own extension. The agent waits here (silent/MoH while
; alone) and the dialer drops connected leads into this same room. The agent's
; WebRTC leg is browser-INITIATED here, so DTLS is reliable (the *43 path that
; works) — Asterisk never dials the browser per-lead, avoiding the DTLS race.
exten => *88,1,NoOp(Agent ${CHANNEL(endpoint)} joining room agent-${CHANNEL(endpoint)})
 same => n,Answer()
 same => n,ConfBridge(agent-${CHANNEL(endpoint)},dialer_bridge,agent_user)
 same => n,Hangup()

;===========================================================================
; AGENT READY — called by system when agent starts
; Plays "you are the only person" to confirm audio, then holds
;===========================================================================
[agent-ready]
exten => s,1,NoOp(Agent connected and ready)
 same => n,Answer()
 same => n,Wait(0.5)
 same => n,Playback(conf-onlyperson)
 same => n,Wait(1)
 same => n,MusicOnHold(default)
 same => n,Hangup()

;===========================================================================
; DIALER OUTBOUND — AMI originates calls to leads via Default Provider
;===========================================================================
[dialer-outbound]
; Default Provider requires the ANI (CallerID number) in international 44 format —
; normalize whatever the campaign/CID-rotation set (e.g. 01234567890) to
; 44-prefixed (441234567890) right before it leaves via the trunk.
exten => _X.,1,Set(CALLERID(num)=${IF($["${CALLERID(num):0:1}" = "0"]?44${CALLERID(num):1}:${CALLERID(num)})})

; 07XXXXXXXXX
exten => _07.,2,NoOp(Dialer outbound 07: ${EXTEN})
 same => n,Dial(PJSIP/44${EXTEN:1}@${TRUNK},30,gTr)
 same => n,Hangup()

; 7XXXXXXXXX (no leading 0)
exten => _7[0-9].,2,NoOp(Dialer outbound 7X: ${EXTEN})
 same => n,Dial(PJSIP/44${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

; 01/02 landline
exten => _0[12].,2,NoOp(Dialer outbound landline: ${EXTEN})
 same => n,Dial(PJSIP/44${EXTEN:1}@${TRUNK},30,gTr)
 same => n,Hangup()

; International 44...
exten => _44.,2,NoOp(Dialer outbound international: ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

; Generic
exten => _X.,2,NoOp(Dialer outbound generic: ${EXTEN})
 same => n,Dial(PJSIP/44${EXTEN}@${TRUNK},30,gTr)
 same => n,Hangup()

;===========================================================================
; DIALER BRIDGE — bridge lead to agent extension
;===========================================================================
; The lead's leg drops into the agent's room (agent-<extension>) where the
; agent is already waiting. No Dial(PJSIP/agent) → no server-initiated WebRTC
; call to the browser → no DTLS race. ${EXTEN} is the agent extension the
; dialer originated toward (e.g. 1001 → room agent-1001).
[dialer-bridge]
exten => _X.,1,NoOp(Dropping lead into agent room agent-${EXTEN})
 same => n,Answer()
 same => n,ConfBridge(agent-${EXTEN},dialer_bridge,lead_user)
 same => n,Hangup()

;===========================================================================
; LEAD HOLD — a PREDICTIVE lead that just answered waits here (hold music)
; while the engine finds a free agent. If an agent is claimed, the backend
; AMI-Redirects this leg into dialer-bridge (the agent's room). If no agent
; frees up within the abandon timeout, the backend hangs this leg up and the
; call is auto-disposed "no answer".
;===========================================================================
[lead-wait]
exten => s,1,NoOp(Lead answered — running AMD on ${CHANNEL})
 same => n,Answer()
 ; Lenient AMD — biased toward HUMAN so we rarely drop a real person; only long
 ; uninterrupted recordings (voicemail greetings) get flagged MACHINE.
 same => n,AMD(2500,2000,800,4000,100,50,3,256,5000)
 same => n,NoOp(AMD result: ${AMDSTATUS} / ${AMDCAUSE})
 same => n,GotoIf($["${AMDSTATUS}" = "MACHINE"]?machine:human)
 ; Human → backend connects a live agent (or abandons), lead holds meanwhile
 same => n(human),UserEvent(LeadHuman)
 same => n,MusicOnHold(default)
 same => n,Hangup()
 ; Answering machine → backend auto-disposes, never reaches an agent
 same => n(machine),UserEvent(LeadMachine)
 ; Hold the dead machine line before hangup to lift the CARRIER's average call
 ; duration (ACD). The hold length is ADMIN-CONFIGURABLE (Settings → Answering-
 ; machine hold): the dialer keeps it in AstDB at dialer/machine_linger; we read
 ; it here, defaulting to 7 if unset (so a call can never error on it).
 ; Safe: the backend already set status='machine' + hung_up_at at the LeadMachine
 ; event, so this call is ALREADY out of the in-flight count — the dialer dials
 ; its replacement immediately and never waits on this linger. Humans untouched.
 same => n,Set(LINGER=${IF($["${DB(dialer/machine_linger)}" != ""]?${DB(dialer/machine_linger)}:7)})
 same => n,Wait(${LINGER})
 same => n,Hangup()

; Same as lead-wait but with AMD OFF — used when the campaign's "AMD enabled" is
; unchecked. Every answered call is treated as a human and connected to an agent.
[lead-wait-noamd]
exten => s,1,NoOp(Lead answered — AMD off, connecting)
 same => n,Answer()
 same => n,UserEvent(LeadHuman)
 same => n,MusicOnHold(default)
 same => n,Hangup()

;===========================================================================
; ABANDONED — no agent available when call answers
;===========================================================================
[dialer-abandoned]
exten => s,1,Answer()
 same => n,Wait(1)
 same => n,Playback(conf-onlyperson)
 same => n,Wait(2)
 same => n,Hangup()

[from-trunk]
exten => _X.,1,Answer()
 same => n,Hangup()
