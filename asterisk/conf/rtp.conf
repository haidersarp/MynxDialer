[general]
rtpstart=10000
rtpend=10100

; ICE support
icesupport=yes

; Asterisk's RTP socket is bound inside the Docker container at 172.18.0.3,
; which is unreachable from the agent's browser over the public internet.
; This override rewrites every ICE host candidate from the unreachable
; internal address to the server's public IP — which Docker's published
; RTP port range (10000-10100/udp) maps 1:1 straight through to the
; container, giving the browser an address+port it can actually reach.
; Replace the left side with your Asterisk container's internal Docker IP
; (find it with `docker inspect`) and the right side with your server's PUBLIC IP.
[ice_host_candidates]
172.18.0.3 => YOUR_PUBLIC_IP
