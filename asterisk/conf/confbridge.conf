[general]

[default_user]
type=user

[default_bridge]
type=bridge

;==========================================================================
; MynxDialer conference rooms ? one private room per agent (agent + 1 lead).
; agent_user: marked; on join (alone) announces "you are the only person" then
;   plays hold music WHILE WAITING. When a lead joins, the music auto-stops and
;   the agent hears the customer. When the lead leaves, music resumes.
; lead_user:  the connected lead; quiet; leaves when the agent leaves.
;==========================================================================
[agent_user]
type=user
marked=yes
announce_only_user=yes
music_on_hold_when_empty=yes
announce_join_leave=no
announce_user_count=no
dtmf_passthrough=yes

[lead_user]
type=user
marked=no
wait_marked=yes
end_marked=yes
quiet=yes
announce_join_leave=no
announce_user_count=no
dtmf_passthrough=yes

[dialer_bridge]
type=bridge
; Agent + 1 connected lead = 2. We allow a little headroom so a transient ZOMBIE
; agent leg (left behind when a browser drops/reconnects, cleared by rtp_timeout)
; doesn't fill the room and make ConfBridge announce "conference is locked",
; blocking the agent from rejoining. The predictive engine only ever redirects
; ONE lead per agent (atomic claim), so the extra slots never carry 2 customers.
max_members=6